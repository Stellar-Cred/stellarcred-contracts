name: deploy-testnet

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    name: Build & deploy to Stellar testnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v27.1.0

      - name: Build contract
        run: stellar contract build

      - name: Configure testnet network
        run: |
          stellar network add testnet \
            --rpc-url https://soroban-testnet.stellar.org:443 \
            --network-passphrase "Test SDF Network ; September 2015" || true

      - name: Fund deployer identity
        run: |
          stellar keys generate deployer --network testnet --fund || true

      - name: Deploy contract
        id: deploy
        run: |
          # Friendbot reports success as soon as the funding tx is submitted,
          # but the RPC endpoint used by `contract deploy` can lag a few
          # seconds before it reflects the new account. Retry on failure.
          CONTRACT_ID=""
          for i in $(seq 1 6); do
            CONTRACT_ID=$(stellar contract deploy \
              --wasm target/wasm32v1-none/release/cred.wasm \
              --source deployer \
              --network testnet \
              -- --admin $(stellar keys address deployer)) && break
            echo "Deploy attempt $i failed, retrying in 5s..."
            sleep 5
          done
          if [ -z "$CONTRACT_ID" ]; then
            echo "Deployment failed after retries" >&2
            exit 1
          fi
          echo "contract_id=$CONTRACT_ID" >> "$GITHUB_OUTPUT"

      - name: Write deployment record
        run: |
          mkdir -p /tmp/deployment
          cat <<EOF > /tmp/deployment/testnet.json
          {
            "CredContract": "${{ steps.deploy.outputs.contract_id }}",
            "network": "testnet",
            "deployedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          {
            echo "### Deployed to Stellar testnet :rocket:"
            echo ""
            echo "**Contract ID:** \`${{ steps.deploy.outputs.contract_id }}\`"
            echo ""
            echo "[View on Stellar Expert](https://stellar.expert/explorer/testnet/contract/${{ steps.deploy.outputs.contract_id }})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload deployment record artifact
        uses: actions/upload-artifact@v4
        with:
          name: testnet-deployment
          path: /tmp/deployment/testnet.json
          retention-days: 90
